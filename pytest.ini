[pytest]
# Tests live at the repo root. Don't descend into local-only folders: other tools' review probes under
# demo/evidence/ (some write files when run) and personal experiments in datamaker_test/.
# The first entries are pytest's defaults, which this setting replaces.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} evidence datamaker_test
